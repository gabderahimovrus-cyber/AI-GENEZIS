[project]
name = "ai-genezis"
version = "0.1.0"
description = "Local autonomous AI Genesis MVP with tokenizer, transformer, training, memory, RAG, and GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "sentencepiece>=0.1.99",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "numpy>=1.24",
]

[project.optional-dependencies]
vector = ["faiss-cpu>=1.7.4"]
test = ["pytest>=7.0"]

[project.scripts]
ai-genesis = "ai_genesis.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
